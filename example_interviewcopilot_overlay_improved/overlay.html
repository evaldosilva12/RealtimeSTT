<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Copilot Overlay</title>
    <link rel="stylesheet" href="overlay.css">
</head>
<body>
    <main class="overlay-shell">
        <header class="overlay-header">
            <div class="drag-region">
                <p class="eyebrow">Interview Copilot</p>
                <div class="status-row" hidden>
                    <span id="socketStatus" class="status-pill status-warn">WS connecting</span>
                    <span id="sttStatus" class="status-pill">STT starting</span>
                    <span id="llmStatus" class="status-pill">LLM unknown</span>
                    <span id="modeStatus" class="status-pill">Interactive</span>
                </div>
            </div>
            <div class="top-actions" aria-label="Transcript actions">
                <button id="answerRecent" type="button" class="primary">Answer</button>
                <button id="quickAnswerRecent" type="button" title="Faster, shorter answer with less live context">Quick</button>
                <button id="clarifyRecent" type="button">Clarify</button>
                <button id="askRecent" type="button" title="Ask the interviewer based on the latest transcript">Ask</button>
                <button id="mergeRecent" type="button" title="Merge the latest transcript with the previous one">Merge</button>
            </div>
            <nav class="window-tools" aria-label="Overlay controls">
                <button id="togglePassThrough" type="button" title="Let clicks pass through overlay">Pass</button>
                <button id="hideOverlay" type="button" class="close-button" aria-label="Hide overlay" title="Hide overlay">X</button>
            </nav>
        </header>

        <section class="live-section" aria-label="Live transcript">
            <div id="partialTranscript" class="partial-transcript" hidden></div>
            <div id="timeline" class="timeline"></div>
        </section>

        <section class="answer-section" aria-label="AI response">
            <article id="activeResponse" class="active-response">
                <div id="responseStatus" class="response-status" hidden></div>
                <div id="responseBody" class="response-body">Waiting for transcript or an action.</div>
            </article>
        </section>
    </main>

    <script type="module" src="js/overlay.js"></script>
</body>
</html>
